version: 2
scene: voice-agent
platform: web
sdk:
  name: "@byteplus/rtc"
  version: "4.67.2"
runtime:
  topology: web-server
  agent_control: server
  ports:
    web: 3000
    server: 3001
tasks:
  post_create:
    - "cp -n .env.example .env.local || true"
  install:
    - "yarn install --frozen-lockfile"
    - "yarn --cwd web install --frozen-lockfile"
    - "yarn --cwd server install --frozen-lockfile"
  dev:
    - "yarn dev"
